<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>MahimJ Maps</title>
  <meta name="description" content="Search places, explore nearby, and get driving, cycling and walking directions." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7z' fill='%230b57d0'/><circle cx='12' cy='9' r='2.6' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Floating search box -->
  <div class="searchbox" id="searchbox">
    <button class="icon-btn" id="menuBtn" title="Menu"><span class="ms">menu</span></button>
    <input id="q" type="text" placeholder="Search MahimJ Maps" autocomplete="off" spellcheck="false" />
    <button class="icon-btn" id="searchBtn" title="Search"><span class="ms">search</span></button>
    <button class="icon-btn" id="clearBtn" title="Clear search" hidden><span class="ms">close</span></button>
    <span class="vdivider"></span>
    <button class="icon-btn blue" id="dirBtn" title="Directions"><span class="ms filled">directions</span></button>
    <ul class="suggest" id="suggest" hidden></ul>
  </div>

  <!-- Category chips -->
  <div class="chips" id="chips"></div>

  <!-- Side panel -->
  <aside class="panel" id="panel">
    <div class="panel-content" id="panelContent"></div>
    <button class="collapse-tab" id="collapseTab" title="Collapse side panel"><span class="ms">arrow_left</span></button>
  </aside>

  <!-- Drawer menu -->
  <div class="scrim" id="scrim" hidden></div>
  <nav class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34a0ff"/><stop offset="1" stop-color="#0b57d0"/></linearGradient></defs><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7z" fill="url(#lg)"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg>
      <span class="brand">MahimJ <b>Maps</b></span>
      <button class="icon-btn" id="drawerClose" title="Close menu"><span class="ms">close</span></button>
    </div>
    <div class="drawer-section">
      <div class="drawer-title"><span class="ms">bookmark</span> Saved places</div>
      <ul class="saved-list" id="savedList"></ul>
    </div>
    <div class="drawer-section">
      <button class="drawer-item" data-action="locate"><span class="ms">my_location</span> Your location</button>
      <button class="drawer-item" data-action="directions"><span class="ms">directions</span> Directions</button>
      <button class="drawer-item" data-action="measure"><span class="ms">straighten</span> Measure distance</button>
      <button class="drawer-item" data-action="share"><span class="ms">share</span> Share this map view</button>
    </div>
    <div class="drawer-section">
      <a class="drawer-item" href="https://github.com/maddy1357/mahimj-earth" target="_blank" rel="noopener"><span class="ms">public</span> MahimJ Earth (3D globe)</a>
      <a class="drawer-item" href="https://github.com/maddy1357/mahimj-maps" target="_blank" rel="noopener"><span class="ms">code</span> Source code</a>
    </div>
    <p class="drawer-foot">Map data © OpenStreetMap contributors. Imagery © Esri. Routing by OSRM.</p>
  </nav>

  <!-- Layer switcher (bottom-left) -->
  <div class="layers" id="layers">
    <button class="layer-thumb" id="layerThumb" title="Layers">
      <span class="thumb-img" id="thumbImg"></span>
      <span class="thumb-label"><span class="ms">layers</span> Layers</span>
    </button>
    <div class="layer-flyout" id="layerFlyout"></div>
  </div>

  <!-- Map controls (bottom-right) -->
  <div class="map-ctrls">
    <button class="ctrl-btn" id="locateBtn" title="Show your location"><span class="ms">my_location</span></button>
    <div class="zoom-group">
      <button id="zoomIn" title="Zoom in"><span class="ms">add</span></button>
      <hr />
      <button id="zoomOut" title="Zoom out"><span class="ms">remove</span></button>
    </div>
  </div>

  <div class="info-card" id="infoCard" hidden></div>
  <div class="measure-card" id="measureCard" hidden>
    <div>
      <div class="mc-title">Measure distance</div>
      <div class="mc-sub" id="mcText">Click on the map to add to your path</div>
    </div>
    <button class="icon-btn" id="mcClose" title="Stop measuring"><span class="ms">close</span></button>
  </div>
  <div class="ctx-menu" id="ctxMenu" hidden></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
